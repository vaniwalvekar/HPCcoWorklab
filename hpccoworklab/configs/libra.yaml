cluster_name: "SLU Libra"

# Every partition your cluster has. Any partition not listed here is treated
# as invalid (a likely typo) by the checker.
partitions:
  # Nodes: comp[01-03],compcasanova (4). Measured via sinfo/scontrol (HPC-10).
  # Note MaxMemPerNode is UNLIMITED (no scheduler cap); mem_gb_max here is just
  # the "bigger than any single node" sanity ceiling for `check`.
  compute:
    is_default: true
    has_gpu: false
    cpus_per_task_max: 64      # 64 logical CPUs/node
    mem_gb_max: 1007           # ~1031520 MB/node
    default_time: 7-00:00:00   # scheduler default if --time omitted
    max_time: 7-00:00:00

  # Nodes: gpu[01-03],gpuhuang (4), each 2x NVIDIA L40S (nvidia_l40s).
  gpu:
    is_default: false
    has_gpu: true
    gpu_max: 2                 # 2x NVIDIA L40S per node
    cpus_per_task_max: 64
    mem_gb_max: 503            # ~515479 MB/node
    default_time: 1-00:00:00
    max_time: 7-00:00:00

  # HETEROGENEOUS: ml[01-02] have 4x H100; mlfrey,mlgong have 2x H100
  # (nvidia_h100_nvl). gpu_max=4 matches the large nodes; a 3-4 GPU job may not
  # fit on mlfrey/mlgong.
  machinelearning:
    is_default: false
    has_gpu: true
    gpu_max: 4                 # 4x H100 on ml01-02; only 2 on mlfrey/mlgong
    cpus_per_task_max: 64
    mem_gb_max: 1007           # ~1031574 MB/node
    default_time: 1-00:00:00
    max_time: 7-00:00:00

# #SBATCH fields that must be present on every job script.
required_fields: ["nodes", "gpus"]

# #SBATCH fields that are best practice but not enforced by the scheduler.
recommended_fields: ["account"]

# If --time is omitted, this is the wall-clock default the scheduler applies.
default_time_days: 7

# Filesystem paths considered slow/inappropriate for data-intensive I/O,
# with the recommended alternative.
slow_io_paths:
  - path_markers: ["/home/", "$HOME"]
    recommend: "$SCRATCH"

# Used by `hpccoworklab watch --log <file>` (HPC-31) to detect real progress from
# the job's log instead of relying only on file timestamps. Each pattern must
# capture a monotonically-increasing counter in group 1. Optional total_regex
# gives the denominator for a percentage / ETA. Omit to skip log detection.
progress_patterns:
  - regex: 'step\s+(\d+)'
    total_regex: 'of\s+(\d+)'
  - regex: 'iteration[: ]+(\d+)'
  - regex: 'epoch[: ]+(\d+)'
    total_regex: 'of\s+(\d+)'
  - regex: '(\d+(?:\.\d+)?)\s*%'

# Regexes that mean the run reached its natural end.
completion_markers:
  - '\b(done|finished|completed)\b'
  - 'exit code[: ]+0'

# Optional (HPC-13, interactive-vs-batch detection in `hpccoworklab check`).
# interactive_markers overrides built-ins (jupyter/ipython/code-server/x11/--pty).
# interactive_partitions lists the queue(s) suited to interactive work; while
# empty, hpccoworklab still flags interactive jobs but can't name the right queue.
# Fill in once confirmed via `sinfo` (HPC-10), e.g. interactive_partitions: [login]
# interactive_markers: ['\bjupyter\b']
# interactive_partitions: []

# Optional (HPC-12, `hpccoworklab check`): override the patterns used to spot a
# Python environment path (defaults cover .venv/venv, .conda/envs, miniconda3,
# anaconda3, bin/activate). An env path that also sits under a slow_io_paths
# marker is flagged. Only explicit paths match, so `conda activate name` is safe.
# env_path_patterns: ['[^\s]+bin/activate']

# Optional (HPC-28): walltime above which `check` nudges you to add checkpointing.
# checkpoint_time_threshold_hours: 24

# Optional (HPC-22, `check`): map software seen in a script to suggested
# `module load` names. Fully cluster-owned so hpccoworklab hardcodes nothing. e.g.:
# software_map:
#   gromacs: {match: ['gmx(_mpi)?\b', 'gromacs'], modules: ['GROMACS']}
#   pytorch: {match: ['\btorch\b', 'import torch'], modules: ['pytorch-cuda']}

# Optional (HPC-42): groups of module names that are mutually exclusive on this
# cluster; if `check` sees two loaded together it warns. Cluster-owned so the
# tool hardcodes nothing. e.g.:
# conflicting_modules:
#   - ['cuda/11', 'cuda/12']
#   - ['gcc/9', 'gcc/11', 'gcc/12']

# Optional (HPC-40, `check --ai`): an OpenAI-compatible endpoint for the
# ADVISORY, off-by-default AI review. Prefer env vars for the secret:
#   HPCCOWORKLAB_AI_BASE_URL, HPCCOWORKLAB_AI_API_KEY, HPCCOWORKLAB_AI_MODEL
# Never required; the deterministic checks are always the source of truth.
# ai:
#   base_url: 'https://<your-provider>/v1'
#   model: 'gpt-4o-mini'
#   api_key: '<optional; prefer the env var>'
