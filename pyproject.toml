[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hpccoworklab"
dynamic = ["version"]
description = "A copilot for Slurm HPC jobs: catches bad resource requests before you submit, watches running jobs to spot the ones that are stuck-but-silent, and explains why a finished job failed. Cluster-agnostic via YAML config."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=5.1",
]

[project.urls]
Homepage = "https://github.com/vaniwalvekar/hpccoworklab"

[project.scripts]
hpccoworklab = "hpccoworklab.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["hpccoworklab*"]

[tool.setuptools.package-data]
"hpccoworklab.configs" = ["*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "hpccoworklab.__version__"}
