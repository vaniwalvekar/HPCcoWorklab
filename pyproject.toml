[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hpclint"
dynamic = ["version"]
description = "A cluster-agnostic linter for Slurm job scripts — catches bad resource requests, missing fields, and misconfigurations before you submit, not after they fail."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=5.1",
]

[project.urls]
Homepage = "https://github.com/vaniwalvekar/hpclint"

[project.scripts]
hpclint = "hpclint.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["hpclint*"]

[tool.setuptools.package-data]
"hpclint.configs" = ["*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "hpclint.__version__"}
